# The API with its meetings in PostgreSQL:
#   docker compose up --build      http://localhost:8088/docs
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bitmeet
      POSTGRES_USER: bitmeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitmeet}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitmeet -d bitmeet"]
      interval: 2s
      timeout: 3s
      retries: 30

  bitmeet:
    build: .
    ports:
      - "8088:8088"
    environment:
      BITMEET_DATABASE_URL: postgres://bitmeet:${POSTGRES_PASSWORD:-bitmeet}@postgres:5432/bitmeet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
