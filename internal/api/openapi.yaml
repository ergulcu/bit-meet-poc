openapi: 3.1.0
info:
  title: BitMeet API
  version: 1.0.0
  description: |
    A planner creates meetings with guests. Meetings of the same planner must not overlap, must end after
    they begin, and their subject must not contain a forbidden word. Dates are dd-MM-yyyy HH:mm (24-hour clock).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths:
  /meetings:
    post:
      summary: Create a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MeetingRequest"}
      responses:
        "201":
          description: Created; Location points at the planner's meetings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meeting"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /meetings/{planner}:
    get:
      summary: The planner's meetings by date
      parameters:
        - {name: planner, in: path, required: true, schema: {type: string, format: email}}
      responses:
        "200":
          description: Meetings, the earliest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Meeting"}
  /meetings/update/{id}:
    put:
      summary: Change subject, guests and dates (the planner stays)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MeetingUpdate"}
      responses:
        "200":
          description: The updated meeting
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meeting"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /meetings/cancel/{id}:
    put:
      summary: Cancel a meeting
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The cancelled meeting
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meeting"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /healthz:
    get:
      summary: Health, including the database
      responses:
        "200": {description: UP}
        "503": {description: DOWN}
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  schemas:
    Date:
      type: string
      pattern: '^\d{2}-\d{2}-\d{4} \d{2}:\d{2}$'
      examples: ["10-03-2026 14:00"]
    MeetingUpdate:
      type: object
      required: [subject, beginDate, endDate]
      properties:
        subject: {type: string, minLength: 5, maxLength: 100}
        guests:
          type: array
          items: {type: string, format: email}
        beginDate: {$ref: "#/components/schemas/Date"}
        endDate: {$ref: "#/components/schemas/Date"}
    MeetingRequest:
      allOf:
        - $ref: "#/components/schemas/MeetingUpdate"
        - type: object
          required: [planner]
          properties:
            planner: {type: string, format: email}
    Meeting:
      type: object
      properties:
        id: {type: integer, format: int64}
        planner: {type: string}
        subject: {type: string}
        guests:
          type: array
          items: {type: string}
        beginDate: {$ref: "#/components/schemas/Date"}
        endDate: {$ref: "#/components/schemas/Date"}
        status: {type: string, enum: [ACTIVE, FINISHED, CANCELLED]}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
